<div class="header">
  <p-toolbar [style]="{'background-color': '#003287'}">
    <ng-template #start>
      <div class="logo-esap">
        <img [src]="logo" />
      </div>
    </ng-template>
    <ng-template #center>
      <div class="titulo">
        <h3>RUND - Módulo de Gestión Profesoral</h3>
      </div>
    </ng-template>
    <ng-template #end>
      @if (usuario()) {
      <div class="nombre">
        <span [innerHTML]="usuario()?.name || usuario()?.email"></span>
      </div>
      <p-button severity="secondary"
                (onClick)="logout()"
                icon="pi pi-sign-out"
                label="Cerrar sesión" />
      } @else if(!enLogin) {
      <p-button (onClick)="irALogin()"
                label="Iniciar sesión"
                icon="pi pi-sign-in"
                severity="primary" />
      }
    </ng-template>
  </p-toolbar>
</div>
