<div class="login-container">
  <div class="login-card">
    <!-- Logo y título -->
    <div class="login-header">
      <div class="logo-titulo">
        <div class="logo">
          @if (logo) {
          <img [src]="logo"
               animate.enter="entra-animacion"
               alt="ESAP"
               class="imagen-logo" />
          }
        </div>
        <h1>RUND</h1>
      </div>
      <p class="subtitle">Módulo de Gestión Profesoral</p>
    </div>

    <!-- Formulario de login -->
    <form [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
          class="login-form">

      <!-- Mensaje de error general -->
      @if (errorMensaje()) {
      <p-message severity="error"
                 [text]="errorMensaje()!"
                 styleClass="w-full mb-3"
                 [closable]="true"
                 (onClose)="limpiarError()" />
      }

      <!-- Campo de usuario -->
      <div class="field">
        <label for="username">Usuario ESAP <small>(sin @esap.edu.co)</small></label>
        <input pInputText
               id="username"
               formControlName="username"
               placeholder="Ingrese su usuario"
               [class.p-invalid]="usernameInvalid"
               styleClass="w-full"
               autocomplete="username" />
        @if (usernameInvalid) {
        <small class="p-error">El usuario es requerido (mínimo 3 caracteres)</small>
        }
      </div>

      <!-- Campo de contraseña -->
      <div class="field">
        <label for="password">Contraseña</label>
        <p-password id="password"
                    formControlName="password"
                    placeholder="Ingrese su contraseña"
                    [class.p-invalid]="passwordInvalid"
                    [feedback]="false"
                    [toggleMask]="true"
                    styleClass="w-full"
                    inputStyleClass="w-full"
                    autocomplete="current-password" />
        @if (passwordInvalid) {
        <small class="p-error">La contraseña es requerida (mínimo 3 caracteres)</small>
        }
      </div>

      <!-- Botón de login -->
      <p-button type="submit"
                label="Iniciar Sesión"
                icon="pi pi-sign-in"
                [loading]="cargando()"
                [disabled]="loginForm.invalid || cargando()"
                styleClass="w-full"
                severity="primary" />

      <!-- Botón de desarrollo (solo en DEV) -->
      <!-- IMPORTANTE: Comentar o eliminar en producción -->
      <p-button type="button"
                label="Login de Desarrollo"
                icon="pi pi-cog"
                (onClick)="loginDev()"
                [loading]="cargando()"
                [disabled]="cargando()"
                styleClass="w-full mt-2"
                severity="secondary"
                [outlined]="true" />

    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>
        <i class="pi pi-info-circle"></i>
        Use su usuario y contraseña ESAP
      </p>
      <p class="text-sm">
        ¿Problemas para acceder? Contacte a OTIC
      </p>
    </div>
  </div>
</div>
