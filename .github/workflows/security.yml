name: Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  audit:
    name: npm audit (producción)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencias de producción
        run: npm audit --audit-level=critical --omit=dev
        # Falla el build solo si hay vulnerabilidades CRITICAL en producción.
        # Las vulnerabilidades HIGH sin fix disponible (ej. quill GHSA-v3m3-f69x-jf25)
        # están mitigadas por la CSP estricta en server.ts y no bloquean el build.
